<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Preview & Responsive Audit | SnoYC Classes</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 3rem;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: #1e293b;
      padding: 0.65rem 1.25rem;
      border-radius: 9999px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      margin-bottom: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .toolbar-title {
      font-size: 0.875rem;
      font-weight: 700;
      color: #94a3b8;
    }

    .device-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      font-size: 0.8125rem;
      font-weight: 600;
      padding: 0.45rem 0.95rem;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .device-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .device-btn.active {
      background: #0046be;
      color: #ffffff;
      border-color: #0046be;
      box-shadow: 0 2px 8px rgba(0, 70, 190, 0.4);
    }

    .open-full-btn {
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.8125rem;
      font-weight: 600;
      padding-left: 0.5rem;
    }

    .open-full-btn:hover {
      text-decoration: underline;
    }

    .phone-container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
    }

    .phone-bezel {
      background: #1e293b;
      border: 12px solid #334155;
      border-radius: 46px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(255, 255, 255, 0.05);
      overflow: hidden;
      position: relative;
      transition: width 0.3s ease, height 0.3s ease;
    }

    .phone-speaker {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 70px;
      height: 5px;
      background: #475569;
      border-radius: 4px;
      z-index: 10;
    }

    iframe {
      border: none;
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: block;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <span class="toolbar-title">📱 Device Emulation:</span>
    <button class="device-btn active" onclick="setDevice(390, 844, this)">iPhone 14 (390×844)</button>
    <button class="device-btn" onclick="setDevice(360, 740, this)">Android (360×740)</button>
    <button class="device-btn" onclick="setDevice(768, 1024, this)">iPad Mini (768×1024)</button>
    <a href="index.html" class="open-full-btn" target="_blank">Open Desktop (index.html) ↗</a>
  </div>

  <div class="phone-container">
    <div class="phone-bezel" id="deviceBezel" style="width: 390px; height: 844px;">
      <div class="phone-speaker"></div>
      <iframe src="index.html" id="previewFrame" title="Mobile Preview"></iframe>
    </div>
  </div>

  <script>
    function setDevice(w, h, btn) {
      const bezel = document.getElementById('deviceBezel');
      bezel.style.width = w + 'px';
      bezel.style.height = h + 'px';
      document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }
  </script>
</body>
</html>
